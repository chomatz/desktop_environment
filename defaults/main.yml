gnome_groups:
  - "@base-x"
  - "@GNOME"
gnome_packages:
  - dconf-editor
  - gnome-extensions-app
  - gnome-themes-extra
  - gnome-tweaks
gnome_packages_50:
  - dconf-editor
  - gnome-extensions-app
  - gnome-tweaks
grub_tweaks:
  - key: GRUB_TERMINAL_OUTPUT
    value: gfxterm
  - key: GRUB_GFXMODE
    value: "{{ grub_menu_resolution | default('1280×720') }}"

...
