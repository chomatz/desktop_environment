---

- name: ensure tasks run only on selected os releases
  block:

    - name: install dbus-x11
      ansible.builtin.package:
        name: dbus-x11
        state: present

    - name: set logind.conf location
      ansible.builtin.set_fact:
        logind_path: /etc/systemd/logind.conf

    - name: copy logind.conf to /etc/systemd
      ansible.builtin.copy:
        src: /usr/lib/systemd/logind.conf
        dest: "{{ logind_path }}"
        remote_src: true

    #check https://docs.ansible.com/projects/ansible/latest/collections/community/general/dconf_module.html
    - name: implement pre-login sleep overrides
      ansible.builtin.command:
        cmd: "sudo -u gdm dbus-launch gsettings set {{ item }}"
      loop:
        - org.gnome.desktop.session idle-delay 0
        - org.gnome.settings-daemon.plugins.power sleep-inactive-ac-timeout 0
        - org.gnome.settings-daemon.plugins.power sleep-inactive-ac-type 'nothing'
        - org.gnome.settings-daemon.plugins.power sleep-inactive-battery-timeout 0
        - org.gnome.settings-daemon.plugins.power sleep-inactive-battery-type 'nothing'
      when: (ansible_distribution_major_version | int) <= 43

    - name: implement pre-login sleep overrides
      ansible.builtin.copy:
        dest: /etc/dconf/db/local.d/10-power
        content: |
          [org/gnome/settings-daemon/plugins/power]
          sleep-inactive-ac-timeout=0
          sleep-inactive-ac-type='nothing'
          sleep-inactive-battery-timeout=0
          sleep-inactive-battery-type='nothing'
      when: (ansible_distribution_major_version | int) >= 44

    - name: implement post-login sleep overrides
      ansible.builtin.lineinfile:
        path: "{{ logind_path }}"
        regexp: '^.*#{{ item }}='
        line: "{{ item }}=ignore"
      loop:
        - HandleLidSwitch
        - HandleLidSwitchExternalPower
        - HandleLidSwitchDocked

    - name: implement post-login sleep overrides
      ansible.builtin.copy:
        dest: /etc/dconf/db/local.d/20-session
        content: |
          [org/gnome/desktop/session]
          idle-delay=uint32 0
      when: (ansible_distribution_major_version | int) >= 44

    - name: apply sleep overrides
      ansible.builtin.command:
        cmd: dconf update
      when: (ansible_distribution_major_version | int) >= 44

    - name: configure additional grub menu tweaks
      ansible.builtin.include_role:
        name: boot_loader
        tasks_from: grub_settings.yml
      vars:
        grub_settings: "{{ grub_tweaks }}"
        grub_task: configure

  when: ansible_distribution == "Fedora"

...
